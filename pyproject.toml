[project]
name = "emporio-da-musica"
version = "0.1.0"
description = "Protótipo de assistente de atendimento da Empório da Música"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic",
    "fastapi",
    "gradio",
    "langchain",
    "langchain-community<0.4",
    "litellm",
    "llama-index-core",
    "llama-index-embeddings-google-genai>=0.6.0",
    "llama-index-vector-stores-postgres",
    "pgvector",
    "psycopg[binary]",
    "pydantic-settings",
    "ragas",
    "sqlalchemy",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
