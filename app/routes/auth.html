<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empório da Música — Entrar</title>
<style>
body {font: 16px system-ui; background: #f5f6fa; color: #243447; margin: 0;}
main {max-width: 420px; margin: 8vh auto; padding: 2rem; background: white; border-radius: 16px;}
label, input, button {display: block; box-sizing: border-box; width: 100%; margin-top: 1rem;}
input, button {padding: .8rem; font: inherit; border: 1px solid #aab; border-radius: 8px;}
button {cursor: pointer; background: #194d65; color: white;}
#status {min-height: 3em;} a {color: #194d65;}
.password-hint {position: fixed; right: 1rem; bottom: 1rem; max-width: calc(100vw - 2rem); box-sizing: border-box; padding: .75rem 1rem; background: white; border: 1px solid #dde1e7; border-radius: 8px; font-size: .85rem;}
</style>
<main>
<h1>Empório da Música</h1>
<p>Área de atendimento ao consumidor</p>
<form id="account">
<label for="email">E-mail</label>
<input id="email" type="email" autocomplete="username" maxlength="254" required>
<label for="password">Senha (10 a 128 caracteres)</label>
<input id="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required>
<button type="submit">Entrar</button>
<button id="register" type="button">Criar conta</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
</main>
<aside class="password-hint">Usuários já cadastrados: senha padrão <strong>senha12345</strong></aside>
<script>
const form = document.querySelector('#account');
const status = document.querySelector('#status');
async function submit(action) {
  if (!form.reportValidity()) return;
  const buttons = form.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  try {
    const response = await fetch('/auth/' + action, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: form.email.value, password: form.password.value})
    });
    const body = await response.json();
    if (response.ok && action === 'login') { window.location.assign('/ui/'); return; }
    status.textContent = response.ok ? body.message :
      (typeof body.detail === 'string' ? body.detail : 'Confira o e-mail e a senha informados.');
  } catch { status.textContent = 'Não foi possível conectar. Tente novamente.'; }
  finally { buttons.forEach(b => b.disabled = false); }
}
form.addEventListener('submit', event => {event.preventDefault(); submit('login');});
document.querySelector('#register').addEventListener('click', () => submit('register'));
</script>
</html>
