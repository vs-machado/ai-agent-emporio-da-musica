x-app: &app
  build: .
  image: ${COMPOSE_PROJECT_NAME:-emporio-da-musica}-app
  environment:
    POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
    POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    CHAT_PRIMARY_MODEL: ${CHAT_PRIMARY_MODEL:-gemini/gemini-2.5-flash-lite}
    CHAT_FALLBACK_MODEL: ${CHAT_FALLBACK_MODEL:-openrouter/deepseek/deepseek-v4.1-flash}
    CHAT_MODEL_TIMEOUT: ${CHAT_MODEL_TIMEOUT:-20}
    CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-2048}
    CHAT_MAX_MODEL_CALLS: ${CHAT_MAX_MODEL_CALLS:-6}
    CHAT_MAX_TOOL_CALLS: ${CHAT_MAX_TOOL_CALLS:-12}
    CHAT_HISTORY_MAX_MESSAGES: ${CHAT_HISTORY_MAX_MESSAGES:-100}
    RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-gemini-embedding-001}
    RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-768}
    RAG_TOP_K: ${RAG_TOP_K:-5}
    RAG_CONTEXT_TOKENS: ${RAG_CONTEXT_TOKENS:-2000}
    RAG_CHUNK_TOKENS: ${RAG_CHUNK_TOKENS:-1000}

services:
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  ingest:
    <<: *app
    command: ["python", "-m", "app.ingestion"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
  index-policies:
    <<: *app
    command: ["python", "-m", "app.rag"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    <<: *app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      index-policies:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=10)"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 10s
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
